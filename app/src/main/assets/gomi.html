<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087fba">
<title>今日のごみ出し｜八丈タウンアプリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 36px;font-family:sans-serif;color:#17324d;background:linear-gradient(180deg,#eaf7ff,#fff 55%)}
.container{max-width:620px;margin:auto}
header,.panel{background:#fff;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 3px 14px #164b7012}
header{text-align:center;margin-top:0}
.icon{font-size:38px}h1{font-size:24px;margin:8px 0}
.sub,.muted{font-size:13px;color:#64748b;line-height:1.7}
.today{background:linear-gradient(120deg,#087fba,#2563eb);color:white;text-align:center}
.today .date{font-size:14px}.today .weekday{font-size:32px;font-weight:bold;margin:5px 0}
label{display:block;font-weight:bold;margin-bottom:10px}
select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;background:white;color:#17324d;font-size:16px}
.result{margin-top:14px;padding:16px;border-radius:14px;background:#f1f8fc}
.result h2{font-size:18px;margin:0 0 10px}
.item{background:white;border-radius:10px;padding:12px;margin-top:8px;font-weight:bold}
.notice{background:#fff7e6;border:1px solid #f4d79a;color:#755318;padding:13px;border-radius:12px;font-size:12px;line-height:1.7;margin-top:14px}
.button{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;background:white;color:#087fba;font-weight:bold;margin-top:18px}
footer{text-align:center;font-size:11px;color:#64748b;line-height:1.8;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="icon">🗑️</div>
  <h1>今日のごみ出し</h1>
  <div class="sub">地区を選ぶと、今日出せるごみを確認できます。</div>
</header>
<section class="panel today">
  <div class="date" id="todayDate">----</div>
  <div class="weekday" id="todayWeekday">--曜日</div>
  <div>今日のごみ収集案内</div>
</section>
<section class="panel">
  <label for="district">お住まいの地区</label>
  <select id="district">
    <option value="三根">三根</option>
    <option value="大賀郷">大賀郷</option>
    <option value="坂上">坂上</option>
  </select>
  <div class="result" aria-live="polite">
    <h2 id="resultTitle">今日の収集品目</h2>
    <div id="resultItems"></div>
    <p class="muted" id="resultNote"></p>
  </div>
  <div class="notice">※正式な地区別収集曜日はまだ登録していません。誤った案内を防ぐため、登録までは「未登録」と表示します。</div>
</section>
<a class="button" href="index.html">← 八丈タウンアプリに戻る</a>
<footer>八丈タウンアプリ（試作版）<br>本アプリは八丈町が運営・公認するものではない個人による独立した取り組みです。<br>ごみ出しの際は八丈町の最新の収集案内もご確認ください。</footer>
</div>
<script>
// 正式な収集曜日を確認したら、下の空欄に登録してください。
// 曜日番号：日=0、月=1、火=2、水=3、木=4、金=5、土=6
// 記入例（説明用・実際の収集日ではありません）
// "三根": {1:["燃やせるごみ"], 4:["資源ごみ"]}
const collectionSchedule = {
  "三根": {},
  "大賀郷": {},
  "坂上": {}
};
const weekdayNames=["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
function updateToday(){
  const now=new Date(), day=now.getDay();
  document.getElementById("todayDate").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  document.getElementById("todayWeekday").textContent=weekdayNames[day];
  const district=document.getElementById("district").value;
  const items=collectionSchedule[district]?.[day]||[];
  const list=document.getElementById("resultItems"), note=document.getElementById("resultNote");
  list.innerHTML="";
  if(items.length){
    items.forEach(name=>{const div=document.createElement("div");div.className="item";div.textContent="♻️ "+name;list.appendChild(div);});
    document.getElementById("resultTitle").textContent="今日出せるごみ";
    note.textContent="収集日の朝、町のルールに従って出してください。";
  }else{
    const div=document.createElement("div");div.className="item";div.textContent="収集曜日データが未登録です";list.appendChild(div);
    document.getElementById("resultTitle").textContent="今日の収集品目";
    note.textContent="正式な地区別収集曜日を登録すると、ここに品目が自動表示されます。";
  }
}
document.getElementById("district").addEventListener("change",updateToday);
updateToday();
</script>
</body>
</html>
